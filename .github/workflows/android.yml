name: Android build

# All APK builds happen here, in GitHub Actions. Never add a local assembleDebug/assembleRelease
# step to the development workflow: the APK is produced only by this workflow.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      rebuild_natives:
        description: "Also rebuild LWJGL/GL4ES/MobileGlues from source (slow, 90-120 min). Not needed for the APK build."
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

env:
  NDK_VERSION: 26.3.11579264
  # Bundled Java runtimes + LWJGL/renderer component packs. They are generated by the source build
  # jobs below, committed nowhere (assets/bundled is gitignored), and pinned here by SHA-256 so the
  # APK can be reproduced from a clean checkout without a 2-hour cross-compile on every push.
  PAYLOAD_TAG: v1.0.4-round7
  PAYLOAD_APK: CSLauncherPro-1.0.4-round7-debug.apk
  PAYLOAD_SHA256: 8da3b7c5a7ce873a4ddd43c3af16ca263d2f3006706877cae09b275f0d305335

jobs:
  # ------------------------------------------------------------------ APK (always)
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages (platform 34, build-tools 34, NDK r26d, CMake 3.22.1)
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using $SDKM (ANDROID_HOME=$ANDROID_HOME)"
          (yes | "$SDKM" --licenses > /dev/null) || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "ndk;$NDK_VERSION" "cmake;3.22.1" > /tmp/sdk.log || { tail -50 /tmp/sdk.log; exit 1; }
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore verified bundled payloads from the pinned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p payload
          gh release download "$PAYLOAD_TAG" --repo "${{ github.repository }}" --pattern "$PAYLOAD_APK" --dir payload
          test -s "payload/$PAYLOAD_APK" || { echo "::error::Release asset $PAYLOAD_APK is missing"; exit 1; }
          echo "$PAYLOAD_SHA256  payload/$PAYLOAD_APK" | sha256sum -c - || { echo "::error::Bundled payload checksum mismatch"; exit 1; }
          rm -rf payload/unpacked && mkdir -p payload/unpacked
          unzip -q "payload/$PAYLOAD_APK" 'assets/bundled/*' -d payload/unpacked
          test -f payload/unpacked/assets/bundled/arm64-v8a/index.json || { echo "::error::index.json missing from bundled payload"; exit 1; }
          mkdir -p app/src/main/assets
          rm -rf app/src/main/assets/bundled
          cp -a payload/unpacked/assets/bundled app/src/main/assets/bundled
          find app/src/main/assets/bundled -maxdepth 3 -type f -printf '%10s  %p\n' | sort -k2 | head -40
        shell: bash

      - name: Core unit tests
        run: ./gradlew :core:test --console=plain

      - name: App unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Android API-level check (minSdk 26)
        run: ./gradlew :app:checkAndroidApi --console=plain

      - name: Lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Build debug APK (GitHub Actions only)
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Native dependency check (every DT_NEEDED of APK libs, runtimes and components resolves)
        run: python3 tools/check_bundle_needed.py app/build/outputs/apk/debug/app-debug.apk app/src/main/assets

      - name: Verify bundled payloads inside the APK
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E "assets/bundled/.*(index.json|\.zip|\.tar\.xz)" | tee /tmp/bundled.txt
          grep -q "assets/bundled/arm64-v8a/components/lwjgl3-android.zip" /tmp/bundled.txt
          grep -q "assets/bundled/arm64-v8a/components/lwjgl34-android.zip" /tmp/bundled.txt
          grep -q "assets/bundled/arm64-v8a/runtimes/jre25.tar.xz" /tmp/bundled.txt
          grep -q "assets/bundled/arm64-v8a/runtimes/jre21.tar.xz" /tmp/bundled.txt
          grep -q "assets/bundled/arm64-v8a/components/mobileglues.zip" /tmp/bundled.txt
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "lib/arm64-v8a/libcsglfw.so"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "lib/arm64-v8a/libc++_shared.so"

      # Publish a real GitHub Release after every successful main build (push or manual dispatch).
      # Pull requests still run all checks but never publish a release. The repository is private,
      # so the release and its assets are visible only to people with repository access.
      - name: Publish APK as a GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          CHECKSUM="${APK}.sha256"
          (cd "$(dirname "$APK")" && sha256sum "$(basename "$APK")" > "$(basename "$CHECKSUM")")

          TAG="cslauncher-build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          TITLE="CS Launcher Pro build ${GITHUB_RUN_NUMBER}"
          NOTES_FILE="/tmp/cslauncher-release-notes.md"
          cat > "$NOTES_FILE" <<EOF
          Automated Android build from commit $GITHUB_SHA.

          - Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - APK: debug-signed build produced by GitHub Actions.
          - SHA-256 checksum is attached as app-debug.apk.sha256.
          EOF

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$CHECKSUM" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$APK" "$CHECKSUM" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TITLE" --notes-file "$NOTES_FILE"
          fi
          echo "Published $APK as release $TAG"

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          if-no-files-found: ignore
          path: |
            core/build/reports/tests/
            core/build/test-results/
            app/build/reports/
            app/build/test-results/
            app/build/outputs/logs/

      - name: Failure summary
        if: failure()
        run: |
          {
            echo "## Android build failed"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- The step that failed is marked above; download **build-reports** for compiler/test/lint output."
            echo "- No APK was produced by this run."
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ optional source rebuilds
  # Kept for regenerating the pinned payloads. They are not part of the APK build path, so a
  # failure here never blocks or invalidates an APK produced by the `build` job.
  natives:
    if: github.event_name == 'workflow_dispatch' && inputs.rebuild_natives == true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        abi: [ arm64-v8a, armeabi-v7a, x86_64 ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install tools (Ant, Ninja, NDK)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ant ninja-build > /dev/null
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          (yes | "$SDKM" --licenses > /dev/null) || true
          "$SDKM" "ndk;$NDK_VERSION" > /tmp/sdk.log || { tail -50 /tmp/sdk.log; exit 1; }
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Generate LWJGL bindings
        run: tools/natives/build_natives.sh gen
      - name: Build natives
        run: tools/natives/build_natives.sh build ${{ matrix.abi }} natives-out
      - uses: actions/upload-artifact@v4
        with:
          name: natives-${{ matrix.abi }}
          path: natives-out/
          if-no-files-found: error
          retention-days: 7

  natives34:
    if: github.event_name == 'workflow_dispatch' && inputs.rebuild_natives == true
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install tools (Ant, Ninja, NDK)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ant ninja-build > /dev/null
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          (yes | "$SDKM" --licenses > /dev/null) || true
          "$SDKM" "ndk;$NDK_VERSION" > /tmp/sdk.log || { tail -50 /tmp/sdk.log; exit 1; }
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Build LWJGL 3.4.3 natives (arm64-v8a)
        run: JOBS=4 tools/natives34/build.sh build arm64-v8a natives34-out
      - name: Verify exports against the LWJGL 3.4.3 jars
        run: tools/natives34/build.sh verify natives34-out
      - name: SDL3 bridge host test
        run: tools/natives34/hosttest/run.sh natives34-out/lwjgl34/jars
      - name: SDL3 stubs are up to date
        run: |
          python3 tools/natives34/gen_sdl_stubs.py --jar natives34-out/lwjgl34/jars/lwjgl-sdl-3.4.3.jar
          git diff --exit-code -- app/src/main/cpp/cssdl3_stubs.c tools/natives34/sdl3_required.txt
      - uses: actions/upload-artifact@v4
        with:
          name: natives34-arm64-v8a
          path: natives34-out/
          if-no-files-found: error
          retention-days: 7
